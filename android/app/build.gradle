plugins { id 'com.android.application' }
def signingProperties = new Properties()
def signingFile = rootProject.file('../.local/android-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
android {
 namespace 'uk.blackyt.app'
 compileSdk 36
 defaultConfig { applicationId 'uk.blackyt.app'; minSdk 26; targetSdk 36; versionCode 60; versionName '0.6.0-native'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 signingConfigs {
  if (signingFile.exists()) nativeLocal {
   storeFile file(signingProperties['storeFile']); storePassword signingProperties['storePassword']
   keyAlias signingProperties['keyAlias']; keyPassword signingProperties['keyPassword']
  }
 }
 buildTypes {
  debug { if (signingFile.exists()) signingConfig signingConfigs.nativeLocal }
  release { minifyEnabled false; if (signingFile.exists()) signingConfig signingConfigs.nativeLocal }
 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST'] } }
}
dependencies {
 implementation 'androidx.annotation:annotation:1.9.1'
 implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'androidx.media3:media3-exoplayer:1.9.3'
 implementation 'androidx.media3:media3-session:1.9.3'
 implementation 'androidx.media3:media3-datasource-okhttp:1.9.3'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
